<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coin Flip</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: transparent;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #f4f4f4;
    overflow: hidden;
  }

  .scene {
    width: 160px;
    height: 160px;
    perspective: 1000px;
  }

  .coin {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
  }

  .coin.flipping {
    animation: flip 2.2s cubic-bezier(.35,.1,.25,1) forwards;
  }

  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    font-weight: bold;
    box-shadow: 0 0 0 6px rgba(0,0,0,0.25) inset, 0 10px 25px rgba(0,0,0,0.5);
  }

  .heads {
    background: linear-gradient(145deg, #ffe17d, #d4a017);
    color: #7a5200;
  }

  .tails {
    background: linear-gradient(145deg, #d8d8d8, #9a9a9a);
    color: #4a4a4a;
    transform: rotateY(180deg);
  }

  @keyframes flip {
    0%   { transform: rotateY(0deg); }
    50%  { transform: rotateY(1800deg); }
    100% { transform: rotateY(3600deg); }
  }

  .coin.result-tails.flipping {
    animation-name: flipTails;
  }

  @keyframes flipTails {
    0%   { transform: rotateY(0deg); }
    50%  { transform: rotateY(1800deg); }
    100% { transform: rotateY(3780deg); }
  }

  #status {
    font-size: 16px;
    min-height: 22px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="coin" id="coin">
      <div class="face heads">H</div>
      <div class="face tails">T</div>
    </div>
  </div>

  <div id="status">Flipping...</div>

<script>
  const coin = document.getElementById('coin');
  const statusEl = document.getElementById('status');

  function flip() {
    statusEl.textContent = 'Flipping...';
    coin.classList.remove('flipping', 'result-tails');

    const isTails = Math.random() < 0.5;

    void coin.offsetWidth;

    if (isTails) coin.classList.add('result-tails');
    coin.classList.add('flipping');

    coin.addEventListener('animationend', () => {
      const result = isTails ? 'tails' : 'heads';
      statusEl.textContent = isTails ? 'Result: Tails' : 'Result: Heads';
      window.parent.postMessage({ type: 'boundaryx-coin-result', result }, '*');
    }, { once: true });
  }

  // Parent sends a 'start' message once the dialog mounts this iframe, so
  // the flip never races the iframe's own document load.
  window.addEventListener('message', (event) => {
    if (event.data?.type === 'boundaryx-coin-start') flip();
  });
</script>

</body>
</html>
